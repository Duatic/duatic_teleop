# AXES
# 0 = Left Stick X
# 1 = Left Stick Y
# 2 = Right Stick X
# 3 = Right Stick Y
# 4 = Left Trigger
# 5 = Right Trigger

# BUTTONS
# 0   = Face Bottom
# 1   = Face Right
# 2   = Face Left
# 3   = Face Top
# 4   = Back Button
# 5   = PS5
# 6   = Menu Button
# 7   = Left Stick Button
# 8   = Right Stick Button
# 9   = Left Shoulder
# 10  = Right Shoulder
# 11  = DPad up
# 12  = DPad down
# 13  = DPad left
# 14  = DPad right

/**:
  ros__parameters:
    button_mapping:
      dead_man_switch: 10
      wrist_rotation_left: 7
      wrist_rotation_right: 8
      switch_controller: 6  # Menu button for switching modes
    axis_mapping:
      left_joystick:
        x: 0
        y: 1
      right_joystick:
        x: 2
        y: 3
      triggers:
        left: 4
        right: 5
    dpad_mapping:
      # Some controllers (e.g. Xbox) report D-Pad as axes (Hat Switch)
      axes:
        x: 6
        y: 7
      # Some controllers (e.g. PS4/PS5) report D-Pad as individual buttons
      buttons:
        up: 11
        down: 12
        left: 13
        right: 14
      # The component each direction focuses, for the active mode to act on. Driving the
      # platform is a mode of its own, reached with the mode button, so it is not a focus
      # target. An empty name leaves a direction unassigned.
      focus_targets:
        up: "hip"
        down: ""
        left: "arm_right"
        right: "arm_left"

    jog:
      max_velocity: 1.0        # rad/s at full stick deflection
      max_acceleration: 5.0    # rad/s^2
      max_position_offset: 0.1 # rad the command may lead the measured position by
      deadzone: 0.1
      # Deflection at which an axis counts as committed, and the deadzone the other axis
      # of that stick then has to clear.
      # Set equal to deadzone to let both axes of a stick drive their joints together.
      dominant_axis_threshold: 0.6

    drive:
      max_velocity: 0.6   # m/s and rad/s at full stick deflection
      acceleration: 0.5   # m/s^2
      deceleration: 1.0   # m/s^2, kept above acceleration so speed sheds faster than it builds
      deadzone: 0.05

    input_rate: 100.0          # Hz, how often the gamepad is read
    jog_publish_rate: 100.0    # Hz, trajectory stream rate
    discovery_rate: 1.0        # Hz, how often controllers and topics are re-checked
    joint_state_timeout: 0.5   # s before a joint state counts as stale

    # Controllers this node may switch. Anything not listed here is invisible to it and can
    # never be deactivated by a mode change.
    managed_controllers:
      - freedrive_controller
      - joint_trajectory_controller
      - mecanum_drive_controller
      - platform_velocity_controller
      - freeze_controller

    # Controllers that lose state when stopped, so they are left running across mode changes.
    protected_controllers:
      - mecanum_drive_controller
      - platform_velocity_controller
