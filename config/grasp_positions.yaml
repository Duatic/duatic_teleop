# Pose sequence for bimanual grasp demo
# hip_pose on POSE type = set hip joints to value AND lock them during IK
# Orientations corrected: Shovel (mount Rz(π/2)) → Clamp (mount identity)
#
# Sequence overview:
#   POS-01: Init position (joint-space)
#   POS-02: Lean down to ground
#   POS-03: Arms together -> start grasping
#   POS-04: Grasped, lift up
#   POS-05: Grasped, lift to mid height
#   POS-06: Grasped, lift to rotation height
#   POS-07: Rotate backwards
#   POS-08: Place down (set orientation after rotation)
#   POS-09: Place down (lower)
#   POS-10: Open gripper
#   POS-11: Arms back up
#   POS-12: Rotate forward
#   POS-13: Arms back to init

POS-01:  # Init position (joint-space)
  type: JOINT
  joints:
    hip_roll: 0.0
    hip_pitch: 0.0
    arm_left/shoulder_rotation: 0.14137546835349105
    arm_left/shoulder_flexion: -0.46856059447401666
    arm_left/elbow_flexion: 2.0457264344522166
    arm_left/forearm_rotation: 0.7033836370322826
    arm_left/wrist_flexion: 0.6744957842291728
    arm_left/wrist_rotation: -1.332441235969184
    arm_right/shoulder_rotation: -0.13995437568568858
    arm_right/shoulder_flexion: -0.46862912056558254
    arm_right/elbow_flexion: 2.0461269623648404
    arm_right/forearm_rotation: -0.713382848135971
    arm_right/wrist_flexion: 0.6787810074901888
    arm_right/wrist_rotation: 1.3359974804930217

POS-02:  # Lean down to ground
  type: POSE
  left_pose: {position: {x: 1.0, y: 0.4, z: 0.1}, orientation: {x: 0.645, y: -0.310, z: 0.660, w: 0.228}}
  right_pose: {position: {x: 1.0, y: -0.4, z: 0.1}, orientation: {x: -0.645, y: -0.310, z: -0.660, w: 0.228}}

POS-03:  # Arms together -> start grasping (lock EE distance from here)
  type: POSE  
  left_pose: {position: {x: 1.0, y: 0.2, z: 0.1}, orientation: {x: 0.645, y: -0.310, z: 0.660, w: 0.228}}
  right_pose: {position: {x: 1.0, y: -0.2, z: 0.1}, orientation: {x: -0.645, y: -0.310, z: -0.660, w: 0.228}}

POS-04:  # Grasped, lift up
  type: LINEAR
  ee_distance_lock: true
  left_pose: {position: {x: 1.0, y: 0.2, z: 0.4}}
  right_pose: {position: {x: 1.0, y: -0.2, z: 0.4}}

POS-05:  # Grasped, lift to mid height (only z changes, hip stays)
  type: LINEAR
  hip_pose: {joints: {hip_roll: 0.0, hip_pitch: 0.0}}
  left_pose: {position: {x: 1.0, y: 0.2, z: 0.7}}
  right_pose: {position: {x: 1.0, y: -0.2, z: 0.7}}

POS-06:  # Grasped, lift to rotation height (x+z change)
  type: LINEAR
  hip_pose: {joints: {hip_roll: 0.0, hip_pitch: 0.0}}
  left_pose: {position: {x: 0.7, y: 0.2, z: 1.0}}
  right_pose: {position: {x: 0.7, y: -0.2, z: 1.0}}

POS-07:  # Rotate backwards
  type: HIP
  duration: 3.0
  hip_pose: {joints: {hip_roll: 3.14, hip_pitch: 0.0}}

POS-08:  # Place down (set orientation after rotation)
  type: POSE
  hip_pose: {joints: {hip_roll: 3.14, hip_pitch: 0.0}}
  left_pose: {position: {x: -0.2, y: -0.2, z: 1.0}, orientation: {x: -0.310, y: -0.645, z: -0.228, w: 0.660}}
  right_pose: {position: {x: -0.2, y: 0.2, z: 1.0}, orientation: {x: 0.310, y: -0.645, z: 0.228, w: 0.660}}

POS-09:  # Place down (lower)
  type: LINEAR
  hip_pose: {joints: {hip_roll: 3.14, hip_pitch: 0.0}}
  left_pose: {position: {x: -0.2, y: -0.2, z: 0.6}}
  right_pose: {position: {x: -0.2, y: 0.2, z: 0.6}}

POS-10:  # Open gripper (release EE distance lock)
  type: POSE
  ee_distance_lock: false
  left_pose: {position: {x: -0.2, y: -0.4, z: 0.6}, orientation: {x: -0.310, y: -0.645, z: -0.228, w: 0.660}}
  right_pose: {position: {x: -0.2, y: 0.4, z: 0.6}, orientation: {x: 0.310, y: -0.645, z: 0.228, w: 0.660}}

POS-11:  # Arms back up
  type: POSE
  hip_pose: {joints: {hip_roll: 3.14, hip_pitch: 0.0}}
  left_pose: {position: {x: -0.2, y: -0.4, z: 1.0}, orientation: {x: -0.310, y: -0.645, z: -0.228, w: 0.660}}
  right_pose: {position: {x: -0.2, y: 0.4, z: 1.0}, orientation: {x: 0.310, y: -0.645, z: 0.228, w: 0.660}}

POS-12:  # Rotate forward
  type: HIP
  duration: 3.0
  hip_pose: {joints: {hip_roll: 0.0, hip_pitch: 0.0}}

POS-13:  # Arms back to init
  type: POSE
  hip_pose: {joints: {hip_roll: 0.0, hip_pitch: 0.0}}
  left_pose: {position: {x: 0.7, y: 0.4, z: 1.0}, orientation: {x: 0.645, y: -0.310, z: 0.660, w: 0.228}}
  right_pose: {position: {x: 0.7, y: -0.4, z: 1.0}, orientation: {x: -0.645, y: -0.310, z: -0.660, w: 0.228}}
